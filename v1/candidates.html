<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#1167a8">
    <title>列車選択 | 新幹線 meets 富士山</title>
    <link rel="stylesheet" href="styles.css">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-C2ESB694FV"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-C2ESB694FV');
    </script>
  </head>
  <body data-screen="candidates">
    <main class="phone-shell">
      <header class="app-header compact">
        <div class="top-utility">
          <p class="brand-kicker">Shinkansen Meets Fuji</p>
          <div class="language-switch" aria-label="Language">
            <button type="button" data-lang-option="ja">JP</button>
            <button type="button" data-lang-option="en">EN</button>
          </div>
        </div>
        <h1 data-i18n="appTitle">新幹線 meets 富士山</h1>
        <p class="header-context" id="candidate-condition"></p>
      </header>

      <nav class="flow-steps" aria-label="画面の流れ">
        <a id="step-to-conditions" href="index.html" data-i18n="stepCondition">1 条件設定</a>
        <span class="active" aria-current="step" data-i18n="stepCandidates">2 列車選択</span>
        <span data-i18n="stepHighlights">3 見どころ情報</span>
      </nav>

      <section class="screen-card" aria-labelledby="candidate-title">
        <div class="section-title compact">
          <h2 id="candidate-title" data-i18n="selectTrain">列車を選択</h2>
        </div>

        <div class="candidate-pager top" aria-label="候補の時間帯移動">
          <span id="candidate-window-label"></span>
          <div class="pager-controls">
            <button class="ghost" id="prev-window" type="button" data-i18n="prevTime">前の時間帯</button>
            <button class="ghost" id="next-window" type="button" data-i18n="nextTime">次の時間帯</button>
          </div>
        </div>

        <div class="candidate-list" id="candidate-list" aria-live="polite"></div>

        <div class="candidate-pager bottom" aria-label="候補の時間帯移動">
          <div class="pager-controls">
            <button class="ghost" id="prev-window-bottom" type="button" data-i18n="prevTime">前の時間帯</button>
            <button class="ghost" id="next-window-bottom" type="button" data-i18n="nextTime">次の時間帯</button>
          </div>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" hidden></div>
    <script src="data/timetable.js"></script>
    <script src="prototype.js"></script>
  </body>
</html>
