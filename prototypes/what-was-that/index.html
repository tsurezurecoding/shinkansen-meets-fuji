<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ed">
  <title>あれ、何？ | 道草</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="あれ、何？ トップ">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>道草</span>
    </a>
    <span class="edition">車窓の気になる景色</span>
  </header>

  <main>
    <section class="intro" aria-labelledby="page-title">
      <p class="kicker">WHAT WAS THAT?</p>
      <h1 id="page-title">一瞬見えた、<br>あれは何？</h1>
      <p class="lead">車窓に残る、あの景色の正体。</p>
    </section>

    <section class="collection" aria-labelledby="collection-title">
      <div class="collection-head">
        <div>
          <p class="section-label">見つかったもの</p>
          <h2 id="collection-title">車窓の「あれ」図鑑</h2>
        </div>
        <p class="result-count" id="result-count" aria-live="polite">6件</p>
      </div>

      <div class="filters" role="group" aria-label="乗り物で絞り込む">
        <button class="filter is-active" type="button" data-filter="all" aria-pressed="true">すべて</button>
        <button class="filter" type="button" data-filter="shinkansen" aria-pressed="false">新幹線</button>
        <button class="filter" type="button" data-filter="local" aria-pressed="false">在来線</button>
      </div>

      <div class="card-grid" id="card-grid"></div>
      <p class="empty" id="empty" hidden>この条件の景色は、まだありません。</p>
    </section>
  </main>

  <footer>
    <p>窓の外の疑問を、旅の続きに。</p>
  </footer>

  <dialog class="detail-dialog" id="detail-dialog" aria-labelledby="dialog-question">
    <div class="dialog-shell">
      <button class="dialog-close" type="button" aria-label="閉じる" title="閉じる">
        <span aria-hidden="true">×</span>
      </button>
      <div class="dialog-visual" id="dialog-visual"></div>
      <div class="dialog-content">
        <p class="dialog-route" id="dialog-route"></p>
        <h2 id="dialog-question"></h2>
        <section class="answer-block" aria-labelledby="answer-title">
          <p class="detail-label" id="answer-title">答え</p>
          <p class="answer" id="dialog-answer"></p>
        </section>
        <div class="detail-sections">
          <section>
            <p class="detail-label">どこから見える？</p>
            <p id="dialog-location"></p>
          </section>
          <section>
            <p class="detail-label">なぜ気になる？</p>
            <p id="dialog-why"></p>
          </section>
          <section>
            <p class="detail-label">確認状況</p>
            <div class="status-list" id="dialog-status"></div>
          </section>
        </div>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
