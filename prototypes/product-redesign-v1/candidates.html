<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>候補列車 | Shinkansen Meets Fuji Prototype v1</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-screen="candidates">
    <main class="phone-shell">
      <header class="app-header compact">
        <a class="back-link" id="back-to-conditions" href="index.html">条件へ戻る</a>
        <h1>候補列車</h1>
        <p id="candidate-condition"></p>
      </header>

      <nav class="flow-steps" aria-label="画面の流れ">
        <a id="step-to-conditions" href="index.html">1 条件</a>
        <span class="active" aria-current="step">2 候補</span>
        <span>3 見どころ</span>
      </nav>

      <section class="screen-card" aria-labelledby="candidate-title">
        <div class="section-title compact">
          <h2 id="candidate-title">列車を選択</h2>
        </div>

        <div class="candidate-pager top" aria-label="候補の時間帯移動">
          <span id="candidate-window-label"></span>
          <div class="pager-controls">
            <button class="ghost" id="prev-window" type="button">前の時間帯</button>
            <button class="ghost" id="next-window" type="button">次の時間帯</button>
          </div>
        </div>

        <div class="candidate-list" id="candidate-list" aria-live="polite"></div>

        <div class="candidate-pager bottom" aria-label="候補の時間帯移動">
          <div class="pager-controls">
            <button class="ghost" id="prev-window-bottom" type="button">前の時間帯</button>
            <button class="ghost" id="next-window-bottom" type="button">次の時間帯</button>
          </div>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" hidden></div>
    <script src="../../data/timetable.js"></script>
    <script src="prototype.js"></script>
  </body>
</html>
