<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shinkansen Meets Fuji Prototype v1</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-screen="conditions">
    <main class="phone-shell">
      <header class="app-header">
        <p class="brand-kicker">Shinkansen Meets Fuji</p>
        <h1>新幹線 meets 富士山</h1>
        <p>乗る列車を選ぶだけで、富士山や車窓の見どころをいつ見るか確認できます。</p>
        <div class="value-chips" aria-label="このアプリでできること">
          <span>見える時間</span>
          <span>座席側</span>
          <span>沿線スポット</span>
        </div>
      </header>

      <nav class="flow-steps" aria-label="画面の流れ">
        <span class="active" aria-current="step">1 条件</span>
        <span>2 候補</span>
        <span>3 見どころ</span>
      </nav>

      <section class="screen-card" aria-labelledby="conditions-title">
        <div class="section-title">
          <h2 id="conditions-title">条件設定</h2>
        </div>

        <div class="direction-control" aria-label="Direction">
          <button class="segmented active" type="button" data-direction="west">下り 新大阪方面</button>
          <button class="segmented" type="button" data-direction="east">上り 東京方面</button>
        </div>

        <div class="form-stack">
          <label>
            <span>乗車駅</span>
            <select id="station-select"></select>
          </label>
          <label>
            <span>出発時刻</span>
            <input id="time-input" type="time">
          </label>
          <label>
            <span>列車番号で探す場合</span>
            <input id="number-input" type="text" inputmode="numeric" placeholder="例: 23">
          </label>
        </div>

        <div class="sticky-actions">
          <button class="primary" id="search-time" type="button">この条件で候補を見る</button>
          <button class="secondary" id="search-number" type="button">列車番号で候補を見る</button>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" hidden></div>
    <script src="../../data/timetable.js"></script>
    <script src="prototype.js"></script>
  </body>
</html>
