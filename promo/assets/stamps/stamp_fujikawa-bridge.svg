<feComposite in="roughInk" in2="inkDensity" operator="in" result="unevenInk"/>
<feGaussianBlur in="unevenInk" stdDeviation="0.16" result="inkBleed"/>
<feMerge><feMergeNode in="inkBleed"/><feMergeNode in="unevenInk"/></feMerge>
</filter>
</defs>
