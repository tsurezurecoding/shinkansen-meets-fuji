<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新幹線の窓 — 30秒プロモーション</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>
    (function () {
      var measurementId = "G-C2ESB694FV";
      var optoutKey = "mado-ga-optout";
      var params = new URLSearchParams(window.location.search);
      var host = window.location.hostname;
      var isLocalPreview = window.location.protocol === "file:" || host === "localhost" || host === "127.0.0.1";
      var storageOptedOut = false;

      try {
        if (params.get("ga") === "off" || params.get("ga_optout") === "1") {
          localStorage.setItem(optoutKey, "1");
        }
        if (params.get("ga") === "on" || params.get("ga_optout") === "0") {
          localStorage.removeItem(optoutKey);
        }
        storageOptedOut = localStorage.getItem(optoutKey) === "1";
      } catch (error) {
        storageOptedOut = false;
      }

      window.MADO_ANALYTICS_DISABLED = isLocalPreview || storageOptedOut;
      window["ga-disable-" + measurementId] = window.MADO_ANALYTICS_DISABLED;
      if (window.MADO_ANALYTICS_DISABLED) return;

      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      var script = document.createElement("script");
      script.async = true;
      script.src = "https://www.googletagmanager.com/gtag/js?id=" + measurementId;
      document.head.appendChild(script);
      window.gtag("js", new Date());
      window.gtag("config", measurementId);
    })();
  </script>
  <!--
    使い方:
    このページは約30秒で1周する16:9のモーションプロモです。
    index.html の「新幹線の窓とは？」モーダル内でも再生されます。
    ?lang=en で英語版になります。
  -->
  <style>
    :root {
      --night: #101c2c;
      --night-2: #1c2f47;
      --accent: #e8704a;
      --accent-soft: #f5c9a8;
      --paper: #faf6ef;
      --ink: #16202e;
      --serif: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
      --sans: "Hiragino Kaku Gothic ProN", "Yu Gothic", -apple-system, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; font-family: var(--sans); overflow: hidden; }
    .stage {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: var(--night); color: #fff;
    }
    .scene {
      position: absolute; inset: 0; display: grid; place-items: center;
      opacity: 0; pointer-events: none; transition: opacity 0.75s ease;
      text-align: center; padding: 5.6vmin;
    }
    .scene.on { opacity: 1; }
    .photo-bg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; opacity: 0.7; transform: scale(1.04);
    }
    .scene.on .photo-bg { animation: slowzoom 6.4s ease both; }
    .shade {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(16,28,44,0.88), rgba(16,28,44,0.44) 55%, rgba(16,28,44,0.72));
    }
    .content { position: relative; z-index: 2; width: min(116vmin, 94vw); margin: 0 auto; }
    .big { font-family: var(--serif); font-size: 6.8vmin; line-height: 1.42; font-weight: 700; }
    .mid { font-family: var(--serif); font-size: 4.6vmin; line-height: 1.55; font-weight: 700; }
    .sub { font-size: 2.35vmin; opacity: 0.82; margin-top: 2.4vmin; letter-spacing: 0.06em; }
    .kicker { color: var(--accent-soft); font-size: 1.75vmin; font-weight: 700; letter-spacing: 0.22em; margin-bottom: 2vmin; }
    .accent { color: var(--accent-soft); }
    .rise { animation: rise 0.95s ease both; }
    .rise2 { animation: rise 0.95s 0.45s ease both; }
    .rise3 { animation: rise 0.95s 1.0s ease both; }
    @keyframes rise { from { transform: translateY(3.6vmin); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slowzoom { from { transform: scale(1.02); } to { transform: scale(1.11); } }

    .split {
      display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 4vmin;
      align-items: center; text-align: left;
    }
    .phone {
      width: 34vmin; margin: 0 auto; border-radius: 4.2vmin;
      background: var(--paper); color: var(--ink);
      border: 0.9vmin solid #29384a;
      box-shadow: 0 4vmin 12vmin rgba(0,0,0,0.38);
      overflow: hidden; opacity: 0;
    }
    .scene.on .phone { animation: phonein 0.8s 0.25s ease both; }
    @keyframes phonein { from { transform: translateY(4vmin) rotate(-2deg); opacity: 0; } to { transform: translateY(0) rotate(-1deg); opacity: 1; } }
    .phone-hero {
      height: 13vmin; background: linear-gradient(rgba(16,28,44,0.1), rgba(16,28,44,0.68)), url("images/20240211_Mt.Fuji.jpg") center/cover;
      display: grid; align-items: end; padding: 1.4vmin; color: #fff; font-weight: 700;
    }
    .phone-body { padding: 1.6vmin; }
    .segline { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8vmin; margin-bottom: 1.1vmin; }
    .pill {
      border-radius: 99px; background: #fff; border: 1px solid #e5ded1;
      padding: 0.7vmin 1vmin; font-size: 1.45vmin; font-weight: 700;
    }
    .pill.active { background: var(--night); color: #fff; }
    .timeline-demo { margin-top: 1.3vmin; display: grid; gap: 0.85vmin; }
    .time-row {
      display: grid; grid-template-columns: auto 1fr auto; gap: 0.8vmin; align-items: center;
      background: #fff; border: 1px solid #e5ded1; border-radius: 1.1vmin;
      padding: 0.9vmin; font-size: 1.35vmin;
    }
    .time-row strong { font-family: var(--serif); font-size: 1.65vmin; }
    .seat { color: var(--accent); font-weight: 800; }

    .photo-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.6vmin;
      align-items: stretch;
    }
    .photo-card {
      position: relative; aspect-ratio: 4 / 5; border-radius: 2.2vmin; overflow: hidden;
      background: #000; border: 0.25vmin solid rgba(255,255,255,0.18);
      box-shadow: 0 1.8vmin 4.8vmin rgba(0,0,0,0.28);
      opacity: 0; transform: translateY(3vmin) scale(0.94);
    }
    .scene.on .photo-card { animation: cardpop 0.55s ease both; }
    .scene.on .photo-card:nth-child(2) { animation-delay: 0.25s; }
    .scene.on .photo-card:nth-child(3) { animation-delay: 0.5s; }
    .scene.on .photo-card:nth-child(4) { animation-delay: 0.75s; }
    @keyframes cardpop { to { opacity: 1; transform: translateY(0) scale(1); } }
    .photo-card img { width: 100%; height: 100%; object-fit: cover; }
    .photo-card p {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 1.1vmin; background: linear-gradient(transparent, rgba(0,0,0,0.78) 22%, rgba(0,0,0,0.82));
      font-size: 1.85vmin; font-weight: 700; text-align: left;
    }

    .seat-board {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.4vmin;
      margin-top: 3vmin;
    }
    .seat-card {
      background: rgba(255,255,255,0.92); color: var(--ink); border-radius: 2.4vmin;
      padding: 2.4vmin; text-align: left; box-shadow: 0 2vmin 7vmin rgba(0,0,0,0.22);
      opacity: 0;
    }
    .scene.on .seat-card { animation: rise 0.8s ease both; }
    .scene.on .seat-card:nth-child(2) { animation-delay: 0.35s; }
    .seat-card h3 { font-family: var(--serif); font-size: 3.2vmin; margin-bottom: 0.8vmin; }
    .seat-card p { font-size: 2vmin; color: #4c5a6b; line-height: 1.6; }

    .stamps { display: flex; gap: 2.6vmin; justify-content: center; margin-top: 3.4vmin; }
    .pstamp {
      width: 12vmin; height: 12vmin; border-radius: 50%;
      background: #fff7f2; border: 0.65vmin solid var(--accent);
      display: grid; place-items: center; font-size: 5.8vmin; opacity: 0;
    }
    .scene.on .pstamp { animation: stamp 0.45s cubic-bezier(0.2, 1.8, 0.4, 1) both; }
    .scene.on .pstamp:nth-child(2) { animation-delay: 0.35s; }
    .scene.on .pstamp:nth-child(3) { animation-delay: 0.7s; }
    .scene.on .pstamp:nth-child(4) { animation-delay: 1.05s; }
    .scene.on .pstamp:nth-child(5) { animation-delay: 1.4s; }
    @keyframes stamp { from { opacity: 0; transform: scale(2.1) rotate(12deg); } to { opacity: 1; transform: scale(1) rotate(-4deg); } }

    .logo-mark {
      width: 13vmin; height: 13vmin; border-radius: 3vmin; background: var(--accent);
      display: grid; place-items: center; margin: 0 auto 2.8vmin;
      font-family: var(--serif); font-size: 7.5vmin; font-weight: 700;
      animation: rise 0.9s ease both;
    }
    .url { margin-top: 3.2vmin; font-size: 2.2vmin; letter-spacing: 0.12em; color: var(--accent-soft); }
    .progress {
      position: fixed; left: 0; bottom: 0; height: 0.6vmin; background: var(--accent);
      width: 0%; transition: width 0.3s linear; z-index: 10;
    }
    .skynote { position: fixed; top: 2.2vmin; right: 2.8vmin; font-size: 1.65vmin; opacity: 0.45; z-index: 10; }

    @media (max-aspect-ratio: 4 / 3) {
      .scene { padding: 5vmin 4vmin; }
      .split { grid-template-columns: 1fr; text-align: center; gap: 2.8vmin; }
      .phone { width: min(48vmin, 86vw); }
      .photo-grid { grid-template-columns: repeat(2, 1fr); }
      .photo-card { aspect-ratio: 16 / 10; }
      .seat-board { grid-template-columns: 1fr; }
      .big { font-size: 6vmin; }
      .mid { font-size: 4.4vmin; }
      .sub { font-size: 2.2vmin; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage"></div>
  <div class="progress" id="bar"></div>
  <p class="skynote">新幹線の窓 — 旅の瞬間を見逃さない · 30 sec</p>

  <script>
    const plang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ja";
    const T = {
      ja: {
        s1k: "TOKAIDO SHINKANSEN",
        s1: "列車を選ぶと、<br><span class='accent'>見える時刻が</span><br>わかる。",
        s1sub: "富士山も、湖も、城も。見える時刻と座席側を、あなたの列車に合わせて。",
        s2: "たとえば、東京 09:12 発。",
        s2sub: "通過時刻がわかれば、スマホを見る時間を、窓を見る時間に変えられる。",
        s3: "収録スポットは、<br><span class='accent'>実写つき17件。</span>",
        s3sub: "ガイドブックに載らない線路ぎわの発見まで。",
        s4: "E席か、A席か。<br>見るべき窓もわかる。",
        s4sub: "予約前にも、乗車中にも。迷う時間を減らします。",
        s5: "見えた景色は、<br><span class='accent'>旅の記録</span>になる。",
        s5sub: "スタンプを集めて、思い出カードへ。",
        s6: "新幹線の窓",
        s6sub: "旅の瞬間を見逃さない",
        url: "tsurezurecoding.github.io/shinkansen-meets-fuji",
        phoneTitle: "東京 → 新大阪",
        pick1: "09:12 東京発", pick2: "E席",
        rows: [["09:55", "富士山", "E席"], ["10:25", "浜名湖", "E席"], ["11:08", "彦根城", "E席"]],
        photos: ["富士山", "浜名湖", "清洲城", "伊吹山"],
        seatE: ["E席", "富士山・伊吹山・城郭車窓"],
        seatA: ["A席", "海・相模湾・左富士・近江富士"],
      },
      en: {
        s1k: "TOKAIDO SHINKANSEN",
        s1: "Pick your train.<br>Know <span class='accent'>when to look.</span>",
        s1sub: "Fuji, lake, castles and more — timed for your ride, with the right seat side.",
        s2: "For example: Tokyo 09:12.",
        s2sub: "When the view has a time, your phone time becomes window time.",
        s3: "17 real-photo<br><span class='accent'>window spots.</span>",
        s3sub: "From famous Fuji to small discoveries beside the tracks.",
        s4: "Seat E or Seat A.<br>Know which window to watch.",
        s4sub: "Before booking, or while onboard.",
        s5: "What you spot<br><span class='accent'>becomes a memory.</span>",
        s5sub: "Collect stamps and make a memory card.",
        s6: "Shinkansen Window",
        s6sub: "Never miss a moment of the journey.",
        url: "tsurezurecoding.github.io/shinkansen-meets-fuji",
        phoneTitle: "Tokyo → Shin-Osaka",
        pick1: "09:12 from Tokyo", pick2: "Seat E",
        rows: [["09:55", "Mt. Fuji", "E"], ["10:25", "Lake Hamana", "E"], ["11:08", "Hikone Castle", "E"]],
        photos: ["Mt. Fuji", "Lake Hamana", "Kiyosu Castle", "Mt. Ibuki"],
        seatE: ["Seat E", "Fuji, Ibuki, castles"],
        seatA: ["Seat A", "Sea, Sagami Bay, Left-Side Fuji"],
      },
    }[plang];

    const photoCuts = [
      "images/20240211_Mt.Fuji.jpg",
      "images/20260505_hamanako_design_photosy.jpg",
      "images/20260530_kiyosu_castle.jpg",
      "images/20240114_ibukiyama.png",
    ];

    function phoneDemo() {
      return `<div class="phone">
        <div class="phone-hero">${T.phoneTitle}</div>
        <div class="phone-body">
          <div class="segline"><div class="pill active">${T.pick1}</div><div class="pill">${T.pick2}</div></div>
          <div class="timeline-demo">${T.rows.map(row => `<div class="time-row"><strong>${row[0]}</strong><span>${row[1]}</span><span class="seat">${row[2]}</span></div>`).join("")}</div>
        </div>
      </div>`;
    }

    function photoGrid() {
      return `<div class="photo-grid">${photoCuts.map((src, i) => `<div class="photo-card"><img src="${src}" alt=""><p>${T.photos[i]}</p></div>`).join("")}</div>`;
    }

    const scenes = [
      {
        dur: 5600,
        html: `<img class="photo-bg" src="images/20240211_Mt.Fuji.jpg" alt=""><div class="shade"></div><div class="content split"><div><p class="kicker rise">${T.s1k}</p><p class="big rise2">${T.s1}</p><p class="sub rise3">${T.s1sub}</p></div>${phoneDemo()}</div>`,
      },
      {
        dur: 5200,
        html: `<div class="content split">${phoneDemo()}<div><p class="mid rise">${T.s2}</p><p class="sub rise2">${T.s2sub}</p></div></div>`,
      },
      {
        dur: 5600,
        html: `<div class="content"><p class="mid rise">${T.s3}</p><p class="sub rise2">${T.s3sub}</p><div style="margin-top:3.2vmin">${photoGrid()}</div></div>`,
      },
      {
        dur: 5000,
        html: `<img class="photo-bg" src="images/20260515_atami_sagami_bay.jpg" alt=""><div class="shade"></div><div class="content"><p class="mid rise">${T.s4}</p><p class="sub rise2">${T.s4sub}</p><div class="seat-board"><div class="seat-card"><h3>${T.seatE[0]}</h3><p>${T.seatE[1]}</p></div><div class="seat-card"><h3>${T.seatA[0]}</h3><p>${T.seatA[1]}</p></div></div></div>`,
      },
      {
        dur: 4600,
        html: `<div class="content"><p class="mid rise">${T.s5}</p><div class="stamps">${["🗻","🌊","🏯","🚤","⛰️"].map(i => `<div class="pstamp">${i}</div>`).join("")}</div><p class="sub rise3">${T.s5sub}</p></div>`,
      },
      {
        dur: 5200,
        html: `<img class="photo-bg" src="images/og-shinkansen-window.png" alt=""><div class="shade"></div><div class="content"><div class="logo-mark">窓</div><p class="big rise2">${T.s6}</p><p class="mid rise2" style="font-size:3.4vmin;opacity:0.92">${T.s6sub}</p><p class="url rise3">${T.url}</p></div>`,
      },
    ];

    const stage = document.getElementById("stage");
    const viewContext = window.self === window.top ? "standalone" : "iframe";
    function ptrack(eventName, params = {}) {
      if (window.MADO_ANALYTICS_DISABLED) return;
      if (typeof window.gtag === "function") window.gtag("event", eventName, { language: plang, context: viewContext, ...params });
    }
    ptrack("promo_view_start");
    setTimeout(() => ptrack("promo_view_10s", { duration_sec: 10 }), 10000);
    setTimeout(() => ptrack("promo_view_complete", { duration_sec: 30 }), 30000);

    stage.innerHTML = scenes.map((s, i) => `<div class="scene" id="sc${i}">${s.html}</div>`).join("");
    const total = scenes.reduce((a, s) => a + s.dur, 0);
    let idx = -1, elapsed = 0, timer = null;

    function next() {
      idx = (idx + 1) % scenes.length;
      if (idx === 0) elapsed = 0;
      document.querySelectorAll(".scene").forEach((el, i) => el.classList.toggle("on", i === idx));
      const sc = document.getElementById("sc" + idx);
      sc.innerHTML = sc.innerHTML;
      document.getElementById("bar").style.width = ((elapsed / total) * 100) + "%";
      elapsed += scenes[idx].dur;
      clearTimeout(timer);
      timer = setTimeout(next, scenes[idx].dur);
    }
    next();
  </script>
</body>
</html>
