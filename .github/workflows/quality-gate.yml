name: quality-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Deterministic build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npm run build:full
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          npm run build:full
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Stage verified checkout for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir "$RUNNER_TEMP/pages-site"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/pages-site"
      - name: Save verified Pages candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-site
          retention-days: 30
