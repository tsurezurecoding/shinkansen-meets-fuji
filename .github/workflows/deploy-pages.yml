name: deploy-pages

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact approved commit SHA from main
        required: true
        type: string
      release_interval_override:
        description: Emergency override for the seven-day release interval
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate approved candidate
        id: candidate
        env:
          CANDIDATE: ${{ inputs.commit }}
        run: |
          if [[ ! "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit must be an exact 40-character lowercase SHA" >&2
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$CANDIDATE" origin/main
          echo "sha=$CANDIDATE" >> "$GITHUB_OUTPUT"
      - name: Enforce seven-day release interval
        if: ${{ !inputs.release_interval_override }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '7 days ago' +%s)
          count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/runs?status=success&per_page=20" --jq "[.workflow_runs[] | select((.created_at | fromdateiso8601) >= $cutoff)] | length")
          if [[ "$count" -gt 0 ]]; then
            echo "A successful Pages release already occurred in the last seven days." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Deterministic build
        run: |
          npm run build
          git diff --exit-code
          npm run build
          git diff --exit-code

  deploy:
    needs: verify-release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-release.outputs.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
