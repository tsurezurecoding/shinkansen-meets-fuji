<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --panel2:#eef1f6; --ink:#141a22; --ink2:#39424f;
  --muted:#66717f; --line:#dde2e9; --line2:#c8d0da;

  --pat0:#1b64c9; --pat1:#c92f6b; --pat2:#0f8f84;
  --cliff:#d92c34; --now:#0f9b6c;
  --shadow:0 1px 2px rgba(18,26,38,.07),0 8px 24px rgba(18,26,38,.06);
  --grid:#e7ebf1;
}

  :root{
    --bg:#0d1117; --panel:#161c24; --panel2:#1d242e; --ink:#e9eef5; --ink2:#c3ccd8;
    --muted:#93a0af; --line:#28313d; --line2:#3a4653;
    --wait:#5d6878; --ride:#5b9bf2; --transfer:#f0a83a; --walk:#a78bf0;
    --pat0:#5b9bf2; --pat1:#f4699b; --pat2:#38c9ba;
    --cliff:#ff6b6b; --now:#2fd39a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    --grid:#222b36;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:15px; line-height:1.6; -webkit-text-size-adjust:100%;
}
.wrap{max-width:1180px; margin:0 auto; padding:18px 16px 64px}
h1{font-size:clamp(20px,4.4vw,30px); line-height:1.25; margin:0 0 4px; letter-spacing:.01em}
h2{font-size:15px; margin:0 0 10px; letter-spacing:.06em; color:var(--muted); font-weight:700}
.lede{margin:0 0 16px; color:var(--muted); font-size:13.5px; max-width:62ch}
.card{background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:16px; box-shadow:var(--shadow); margin-bottom:16px; min-width:0}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}

/* ---- route tabs ---- */
.tabs{display:flex; gap:8px; flex-wrap:wrap; margin:0 0 16px}
.tab{appearance:none; border:1px solid var(--line2); background:var(--panel); color:var(--ink2);
  border-radius:999px; padding:9px 15px; font:inherit; font-size:14px; cursor:pointer;
  transition:.14s; min-width:0}
.tab b{display:block; font-size:15px; color:var(--ink)}
.tab small{display:block; font-size:11.5px; color:var(--muted); letter-spacing:.04em}
.tab:hover{border-color:var(--pat0)}
.tab[aria-selected="true"]{background:var(--ink); border-color:var(--ink)}
.tab[aria-selected="true"] b,.tab[aria-selected="true"] small{color:var(--bg)}

/* ---- stat tiles ---- */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:10px}
.stat{background:var(--panel2); border-radius:11px; padding:10px 12px}
.stat .k{font-size:11.5px; color:var(--muted); letter-spacing:.05em}
.stat .v{font-size:24px; font-weight:700; line-height:1.15}
.stat .v i{font-style:normal; font-size:13px; font-weight:600; color:var(--muted); margin-left:2px}
.stat .s{font-size:11.5px; color:var(--muted)}

/* ---- chart ---- */
.charthead{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; margin-bottom:10px}
.legend{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12.5px; color:var(--ink2)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.sw{width:13px; height:13px; border-radius:3px; display:inline-block}
.sw.line{height:0; border-top:3px solid; border-radius:0; width:16px}
.spacer{flex:1 1 auto}
.zoom{display:flex; gap:0; border:1px solid var(--line2); border-radius:8px; overflow:hidden}
.zoom button{appearance:none; border:0; background:var(--panel); color:var(--ink2); font:inherit;
  font-size:12.5px; padding:5px 11px; cursor:pointer; border-left:1px solid var(--line2)}
.zoom button:first-child{border-left:0}
.zoom button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.scroll{overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; margin:0 -4px; padding:0 4px}
svg.chart{display:block; touch-action:pan-x; outline:none}
svg.chart:focus-visible{outline:2px solid var(--pat0); outline-offset:2px}
.axhint{font-size:11.5px; color:var(--muted); margin-top:6px}

/* ---- hover detail ---- */
.detail{margin-top:14px; border-top:1px dashed var(--line2); padding-top:14px}
.dhead{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:10px}
.dhead .t{font-size:26px; font-weight:700; letter-spacing:.01em}
.dhead .sub{font-size:12.5px; color:var(--muted)}
.pill{display:inline-block; font-size:11.5px; padding:2px 9px; border-radius:999px;
  background:var(--panel2); color:var(--ink2)}
.pill.warn{background:color-mix(in srgb, var(--cliff) 16%, transparent); color:var(--cliff); font-weight:700}
.pill.good{background:color-mix(in srgb, var(--now) 18%, transparent); color:var(--now); font-weight:700}
.opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px}
.opt{border:1px solid var(--line); border-radius:11px; padding:11px 12px; min-width:0}
.opt.best{border-color:currentColor; background:color-mix(in srgb, currentColor 6%, transparent)}
.opt .oh{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.opt .oh b{font-size:13.5px}
.opt .oh .tot{margin-left:auto; font-size:20px; font-weight:700}
.bar{display:flex; height:13px; border-radius:4px; overflow:hidden; margin:9px 0 8px; background:var(--panel2)}
.bar i{display:block; height:100%}
.chain{font-size:13px; color:var(--ink2); line-height:1.75; word-break:break-word}
.chain .tm{font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums}
.chain .ar{color:var(--muted); padding:0 2px}
.omet{font-size:11.5px; color:var(--muted); margin-top:6px; display:flex; gap:12px; flex-wrap:wrap}

/* ---- cliffs ---- */
.cliffcard{border-color:color-mix(in srgb, var(--cliff) 40%, var(--line))}
.cliffcard h2{color:var(--cliff)}
.cliffs{display:grid; grid-template-columns:repeat(auto-fill,minmax(238px,1fr)); gap:10px}
.cliff{appearance:none; text-align:left; font:inherit; cursor:pointer;
  border:1px solid var(--line); border-radius:11px; padding:10px 12px; background:var(--panel2); color:var(--ink)}
.cliff:hover,.cliff:focus-visible{border-color:var(--cliff); outline:none}
.cliff .big{font-size:19px; font-weight:700; letter-spacing:-.01em}
.cliff .big em{font-style:normal; color:var(--cliff)}
.cliff .sm{font-size:11.5px; color:var(--muted); margin-top:6px}
.cmp{margin-top:8px; display:flex; flex-direction:column; gap:6px}
.cr{border-left:3px solid var(--line2); padding-left:9px}
.cr.ok{border-color:var(--now)}
.cr.ng{border-color:var(--cliff)}
.cr .l1{display:flex; align-items:baseline; gap:6px; font-size:14px; color:var(--ink)}
.cr .l1 .ar{color:var(--muted)}
.cr .l1 .tt{margin-left:auto; font-weight:700}
.cr.ok .l1 .tt{color:var(--now)}
.cr.ng .l1 .tt{color:var(--cliff)}
.cr .l2{font-size:11.5px; color:var(--muted); line-height:1.4}
.kindleg{margin-bottom:12px; font-size:12px}
.kindleg .lbl{color:var(--muted); letter-spacing:.04em}

.row2{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; align-items:start}
.row2 > .card{margin-bottom:0}
label.f{display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--ink2); flex-wrap:wrap}

.rev{margin-top:12px; display:flex; flex-direction:column; gap:9px}
.revrow{display:flex; gap:10px; align-items:baseline; border-left:3px solid currentColor; padding-left:10px; flex-wrap:wrap}
.revrow .d{font-size:21px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink)}
.revrow .l{font-size:12.5px; color:var(--muted)}

.nowrow{display:flex; gap:10px; align-items:baseline; font-size:13px; color:var(--ink2); flex-wrap:wrap}
.nowrow .d{font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink); min-width:56px}

.share .tr i{display:block; height:100%; background:currentColor}
.foot{color:var(--muted); font-size:11.5px; margin-top:8px}
.kbd{border:1px solid var(--line2); border-bottom-width:2px; border-radius:5px; padding:0 5px;
  font-size:11px; background:var(--panel2)}
</style>
</head>

</div>

/* ---------- decode ---------- */
const S = D.s, KINDS = D.kinds;
const LEGS = D.legs.map(a => ({
  kind: KINDS[a[0]], min: a[1],
  from: a[2] < 0 ? null : S[a[2]],
  at:   a[2] < 0 ? null : S[a[2]],
  to:   a[3] < 0 ? null : S[a[3]],
  trainType: a[4] < 0 ? null : S[a[4]]
}));
const PLANS = D.plans.map(seq => {
  const legs = seq.map(i => LEGS[i]);
  const sums = {wait:0, ride:0, transfer:0, walk:0};
  let total = 0;
  for (const l of legs){ sums[l.kind] += l.min; total += l.min; }
  return {legs, sums, total, wait: legs[0].min};
});

const KIND_ORDER = ["wait","ride","transfer","walk"];
const KIND_LABEL = {wait:"待ち時間", ride:"乗車", transfer:"乗換待ち", walk:"徒歩"};
const KIND_VAR = {wait:"var(--wait)", ride:"var(--ride)", transfer:"var(--transfer)", walk:"var(--walk)"};
const PAT_VAR = ["var(--pat0)","var(--pat1)","var(--pat2)"];

function fmt(m){
  if (m == null) return "--:--";
  const h = Math.floor(m / 60), mm = m % 60;
  return String(h) + ":" + String(mm).padStart(2, "0");
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- per-route derivation ---------- */
function buildRoute(r){
  const P = r.patterns, np = P.length;
  const mins = [];
  const byMin = new Map();
  r.rows.forEach((row, i) => {
    if (!row) return;
    const depart = r.start + i;
    const opts = [];
    for (let p = 0; p < np; p++){
      const pi = row[p + 1];
      if (pi < 0){ opts.push(null); continue; }
      const plan = PLANS[pi];
      opts.push({plan, total: plan.total, board: depart + plan.wait, arrive: depart + plan.total});
    }
    const e = {depart, best: row[0], opts};
    mins.push(e); byMin.set(depart, e);
  });

  const bestTotal = m => { const e = byMin.get(m); return e ? e.opts[e.best].total : null; };

  // 崖: 1分後ろにずらしたときの増分 + その先10分での最大増分
  const cliffs = [];
  for (const e of mins){
    const cur = e.opts[e.best].total;
    const nx = bestTotal(e.depart + 1);
    if (nx == null) continue;
    let runup = nx - cur;
    for (let k = 2; k <= 10; k++){
      const v = bestTotal(e.depart + k);
      if (v == null) break;
      runup = Math.max(runup, v - cur);
    }
    cliffs.push({depart: e.depart, step: nx - cur, runup, total: cur});
  }
  const top = cliffs.filter(c => c.step >= 3)
                    .sort((a, b) => b.step - a.step || b.runup - a.runup || a.depart - b.depart);
  // 近接した崖はまとめる（同じ列車を逃す話なので）
  const picked = [];
  for (const c of top){
    if (picked.some(p => Math.abs(p.depart - c.depart) <= 3)) continue;
    picked.push(c);
    if (picked.length >= 8) break;
  }
  picked.sort((a, b) => a.depart - b.depart);

  const totals = mins.map(e => e.opts[e.best].total).sort((a, b) => a - b);
  const median = totals.length ? (totals.length % 2 ? totals[(totals.length - 1) / 2]
                 : Math.round((totals[totals.length / 2 - 1] + totals[totals.length / 2]) / 2)) : 0;
  const dayMin = totals[0], dayMax = totals[totals.length - 1];
  const argMin = mins.filter(e => e.opts[e.best].total === dayMin).map(e => e.depart);
  const argMax = mins.filter(e => e.opts[e.best].total === dayMax).map(e => e.depart);

  const wins = new Array(np).fill(0);
  for (const e of mins) wins[e.best]++;

  // 勝敗帯のラン
  const runs = [];
  for (const e of mins){
    const last = runs[runs.length - 1];
    if (last && last.pat === e.best && last.end === e.depart - 1) last.end = e.depart;
    else runs.push({pat: e.best, start: e.depart, end: e.depart});
  }

  const yMax = Math.max(10, Math.ceil(dayMax / 10) * 10);
  const x0 = mins[0].depart, x1 = mins[mins.length - 1].depart + 1;

  return {route: r, mins, byMin, cliffs, picked, median, dayMin, dayMax, argMin, argMax,
          wins, runs, yMax, x0, x1};
}

/* ---------- state ---------- */
const state = {ri: 0, zoom: 1, hover: null, pinned: false};
let R = null;

const $ = id => document.getElementById(id);

function selectRoute(i){
  state.ri = i;
  R = buildRoute(D.routes[i]);
  state.hover = null; state.pinned = false;
  renderTabs(); renderToggles(); renderStats(); renderChart(); renderDetail(); renderCliffs();
  renderReverse(); renderNow();
}

/* ---------- tabs / toggles ---------- */
function renderTabs(){
  const box = $("tabs");
  if (!box.children.length){
    box.innerHTML = D.routes.map((r, i) =>
      `<button class="tab" role="tab" data-i="${i}">` +
      `<b>${esc(r.destination)}</b><small>${esc(r.origin)}発</small></button>`).join("");
  }
  [...box.children].forEach((b, i) => b.setAttribute("aria-selected", String(i === state.ri)));
}
function renderToggles(){
  $("patlegend").innerHTML = R.route.patterns.map((p, i) =>
    `<span><i class="sw" style="background:${PAT_VAR[i]};opacity:.82"></i>${esc(p.label)}</span>`).join("") +
    (R.route.patterns.length < 2 ? `<span style="color:var(--muted)">（この区間は経路が1通りだけ）</span>` : "");
}

/* ---------- stats ---------- */
function renderStats(){
  const st = [
    {k: "最速", v: R.dayMin, s: R.argMin.slice(0, 2).map(fmt).join(" / ") + "発"},
    {k: "中央値", v: R.median, s: "一日の真ん中"},
    {k: "最遅", v: R.dayMax, s: R.argMax.slice(0, 2).map(fmt).join(" / ") + "発"},
    {k: "最速との差", v: R.dayMax - R.dayMin, s: "時刻選びの伸びしろ"}
  ];
  $("stats").innerHTML = st.map(x =>
    `<div class="stat"><div class="k">${x.k}</div><div class="v num">${x.v}<i>分</i></div>` +
    `<div class="s num">${esc(x.s)}</div></div>`).join("");

  const n = R.mins.length;
  $("shares").innerHTML = R.route.patterns.map((p, i) => {
    const pc = Math.round(R.wins[i] / n * 1000) / 10;
    return `<div class="share" style="color:${PAT_VAR[i]}"><div class="lb">` +
      `<span style="color:var(--ink2)">${esc(p.label)}が最速</span>` +
      `<b class="num">${pc}%<span style="color:var(--muted);font-weight:400"> ・${R.wins[i]}分</span></b></div>` +
      `<div class="tr"><i style="width:${pc}%"></i></div></div>`;
  }).join("");
}

/* ---------- chart ---------- */
const GEO = {padL: 40, padR: 10, padT: 12, padB: 30};
let chartW = 0, chartH = 0, plotW = 0, plotH = 0, sx = 1;

function xOf(m){ return GEO.padL + (m - R.x0) * sx; }
function minuteAt(px){ return Math.round((px - GEO.padL) / sx + R.x0); }

function renderChart(){
  const svg = $("chart");
  const sc = $("scroll"), cs = getComputedStyle(sc);
  const inner = sc.clientWidth - parseFloat(cs.paddingLeft || 0) - parseFloat(cs.paddingRight || 0);
  const avail = Math.max(Math.floor(inner) - 1, 300);
  chartW = Math.max(avail, 680) * state.zoom;
  chartH = window.innerWidth < 560 ? 258 : 320;
  plotW = chartW - GEO.padL - GEO.padR;
  plotH = chartH - GEO.padT - GEO.padB;
  sx = plotW / (R.x1 - R.x0);
  const yMax = R.yMax;
  const yOf = v => GEO.padT + plotH - Math.min(v, yMax) / yMax * plotH;
  const baseY = GEO.padT + plotH;

  const parts = [];
  parts.push(`<defs><clipPath id="cp"><rect x="${GEO.padL}" y="${GEO.padT - 4}" width="${plotW}" height="${plotH + 4}"/></clipPath></defs>`);

  // y grid
  const yStep = yMax > 120 ? 30 : yMax > 60 ? 20 : 10;
  for (let v = 0; v <= yMax; v += yStep){
    const y = yOf(v);
    parts.push(`<line x1="${GEO.padL}" y1="${y}" x2="${GEO.padL + plotW}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`);
    parts.push(`<text x="${GEO.padL - 7}" y="${y + 4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${v === yMax ? v + "分" : v}</text>`);
  }

  // x ticks
  const hourPx = 60 * sx;
  const hStep = hourPx > 40 ? 1 : hourPx > 22 ? 2 : 3;
  for (let h = 4; h <= 26; h++){
    const m = h * 60;
    if (m < R.x0 + 2 || m > R.x1 - 2) continue;
    const x = xOf(m);
    const major = h % hStep === 0;
    parts.push(`<line x1="${x}" y1="${GEO.padT}" x2="${x}" y2="${baseY + (major ? 4 : 2)}" stroke="var(--grid)" stroke-width="1"/>`);
    if (major) parts.push(`<text x="${x}" y="${chartH - 6}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${h}</text>`);
  }

  // 最速所要時間の単一系列。色は「その分どのパターンが勝っているか」を表す
  parts.push(`<g clip-path="url(#cp)">`);
  for (const run of R.runs){
    const up = [], dn = [];
    for (let m = run.start; m <= run.end; m++){
      const e = R.byMin.get(m);
      if (!e) continue;
      const a = xOf(m), b = xOf(m + 1), y = yOf(e.opts[e.best].total);
      up.push(`${a.toFixed(1)},${y.toFixed(1)}`, `${b.toFixed(1)},${y.toFixed(1)}`);
      dn.push(`${b.toFixed(1)},${baseY}`, `${a.toFixed(1)},${baseY}`);
    }
    if (!up.length) continue;
    dn.reverse();
    // 隣の run と隙間なく繋ぐため、境界を半ピクセル広げる
    parts.push(`<path d="M${up.join(" L ")} L ${dn.join(" L ")}Z" fill="${PAT_VAR[run.pat]}" fill-opacity=".78" stroke="${PAT_VAR[run.pat]}" stroke-width=".6" stroke-opacity=".9"/>`);
  }

  // cliff markers
  for (const c of R.picked){
    const x = xOf(c.depart + 1);
    parts.push(`<line x1="${x}" y1="${GEO.padT}" x2="${x}" y2="${baseY}" stroke="var(--cliff)" stroke-width="1" stroke-dasharray="2 3" stroke-opacity=".75"/>`);
    parts.push(`<path d="M${x - 4.5} ${GEO.padT + 8} L${x + 4.5} ${GEO.padT + 8} L${x} ${GEO.padT + 1} Z" fill="var(--cliff)"/>`);
  }
  parts.push(`</g>`);

  // baseline
  parts.push(`<line x1="${GEO.padL}" y1="${baseY}" x2="${GEO.padL + plotW}" y2="${baseY}" stroke="var(--line2)" stroke-width="1"/>`);

  // now line
  const now = nowMinute();
  if (now != null && now >= R.x0 && now <= R.x1){
    const x = xOf(now);
    parts.push(`<line x1="${x}" y1="${GEO.padT - 4}" x2="${x}" y2="${baseY + 4}" stroke="var(--now)" stroke-width="1.6"/>`);
    parts.push(`<circle cx="${x}" cy="${GEO.padT - 4}" r="3" fill="var(--now)"/>`);
    parts.push(`<text x="${x + 5}" y="${GEO.padT + 4}" font-size="10" fill="var(--now)" font-weight="700">いま</text>`);
  }

  parts.push(`<g id="cursorg"></g>`);
  cursorY = yOf; cursorBottom = baseY + 4;

  svg.setAttribute("width", chartW);
  svg.setAttribute("height", chartH);
  svg.setAttribute("viewBox", `0 0 ${chartW} ${chartH}`);
  svg.innerHTML = parts.join("");
  renderCursor();
}

/* カーソルだけ差し替える（面パスの再構築は重いので触らない） */
let cursorY = null, cursorBottom = 0;
function renderCursor(){
  const g = document.getElementById("cursorg");
  if (!g || !cursorY) return;
  const m = state.hover;
  if (m == null || !R.byMin.has(m)){ g.innerHTML = ""; return; }
  const x = xOf(m), e = R.byMin.get(m);
  const y = cursorY(e.opts[e.best].total);
  g.innerHTML =
    `<line x1="${x}" y1="${GEO.padT - 4}" x2="${x}" y2="${cursorBottom}" stroke="var(--ink)" stroke-width="1" stroke-opacity=".55"/>` +
    `<circle cx="${x}" cy="${y}" r="3.4" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.6"/>`;
}

/* ---------- hover detail ---------- */
function chain(depart, o){
  const out = [`<span class="tm">${fmt(depart)}</span>発`];
  let t = depart, rides = 0;
  for (const l of o.plan.legs){
    if (l.kind === "wait"){ t += l.min; continue; }
    if (l.kind === "ride"){
      out.push(`<span class="tm">${fmt(t)}</span> ${esc(l.trainType)}${rides === 0 ? "に乗車" : ""}`);
      t += l.min; rides++;
      out.push(`<span class="tm">${fmt(t)}</span> ${esc(l.to)}着`);
    } else if (l.kind === "walk"){
      out.push(`徒歩${l.min}分で${esc(l.to)}へ`);
      t += l.min;
    } else { t += l.min; }
  }
  return out.join('<span class="ar">→</span>') + `（${o.total}分）`;
}

function renderDetail(){
  const el = $("detail");
  const m = state.hover;
  if (m == null || !R.byMin.has(m)){
    el.innerHTML = `<p class="chain" style="color:var(--muted)">グラフに触れる／マウスを乗せると、その分の行程が出ます。</p>`;
    return;
  }
  const e = R.byMin.get(m);
  const cur = e.opts[e.best].total;
  const nxt = R.byMin.get(m + 1);
  const dStep = nxt ? nxt.opts[nxt.best].total - cur : null;
  const loss = cur - R.dayMin;

  let head = `<div class="dhead"><div class="t num">${fmt(m)}発</div>` +
    `<div class="sub num">最速 ${cur}分・${fmt(e.opts[e.best].arrive)}着</div>`;
  if (dStep != null){
    head += dStep >= 3
      ? `<span class="pill warn">1分あとに出ると +${dStep}分</span>`
      : `<span class="pill">1分あと ${dStep >= 0 ? "+" : ""}${dStep}分</span>`;
  }
  head += loss > 0
    ? `<span class="pill">ロス時間 +${loss}分（この日の最速 ${R.dayMin}分）</span>`
    : `<span class="pill good">この日の最速タイ</span>`;
  head += `</div>`;

  const opts = R.route.patterns.map((p, pi) => {
    const o = e.opts[pi];
    if (!o) return `<div class="opt" style="color:${PAT_VAR[pi]}"><div class="oh"><b>${esc(p.label)}</b></div>` +
      `<p class="chain" style="color:var(--muted)">この時刻はこのパターンの経路なし</p></div>`;
    const segs = KIND_ORDER.filter(k => o.plan.sums[k] > 0).map(k =>
      `<i style="width:${(o.plan.sums[k] / o.total * 100).toFixed(2)}%;background:${KIND_VAR[k]}" title="${KIND_LABEL[k]} ${o.plan.sums[k]}分"></i>`).join("");
    const met = KIND_ORDER.filter(k => o.plan.sums[k] > 0)
      .map(k => `<span>${KIND_LABEL[k]} ${o.plan.sums[k]}分</span>`).join("");
    return `<div class="opt${pi === e.best ? " best" : ""}" style="color:${PAT_VAR[pi]}">` +
      `<div class="oh"><b>${esc(p.label)}</b>` +
      (pi === e.best ? `<span class="pill good">最速</span>` : `<span class="pill">+${o.total - cur}分</span>`) +
      `<span class="tot num">${o.total}<span style="font-size:12px">分</span></span></div>` +
      `<div class="bar">${segs}</div><div class="chain">${chain(m, o)}</div>` +
      `<div class="omet num">${met}<span>${fmt(o.arrive)}着</span></div></div>`;
  }).join("");

  el.innerHTML = head + `<div class="opts">${opts}</div>`;
}

/* ---------- cliffs ---------- */
function renderCliffs(){
  if (!R.picked.length){
    $("cliffs").innerHTML = `<p class="chain" style="color:var(--muted)">この経路には目立った崖がありません（本数が均等）。</p>`;
    return;
  }
  $("cliffs").innerHTML = R.picked.map(c => {
    const a = R.byMin.get(c.depart), b = R.byMin.get(c.depart + 1);
    const oa = a.opts[a.best], ob = b.opts[b.best];
    const row = (e, o, ok) =>
      `<div class="cr ${ok ? "ok" : "ng"}">` +
      `<div class="l1 num"><b>${fmt(e.depart)}発</b><span class="ar">→</span><b>${fmt(o.arrive)}着</b>` +
      `<span class="tt">${o.total}分</span></div>` +
      `<div class="l2 num">${fmt(o.board)} ${esc(firstType(o))}・${esc(R.route.patterns[e.best].label)}</div></div>`;
    const wait = ob.board - oa.board;
    const why = wait > 0
      ? `1分の差で乗る列車が${wait}分あと` + (a.best !== b.best ? `／経路も入れ替わる` : "")
      : `同じ列車に乗れず遠回りになる`;
    return `<button class="cliff" data-m="${c.depart}">` +
      `<div class="big num">${fmt(c.depart)}を逃すと <em>+${c.step}分</em></div>` +
      `<div class="cmp">${row(a, oa, true)}${row(b, ob, false)}</div>` +
      `<div class="sm">${why}` +
      (c.runup > c.step ? `／この先10分では最大 +${c.runup}分` : "") + `</div></button>`;
  }).join("");
}
function firstType(o){
  for (const l of o.plan.legs) if (l.kind === "ride") return l.trainType;
  return "";
}

/* ---------- 逆引き ---------- */
function renderReverse(){
  const v = $("arriveBy").value;
  if (!v){ $("rev").innerHTML = ""; return; }
  const [hh, mm] = v.split(":").map(Number);
  let target = hh * 60 + mm;
  if (target < 240) target += 1440;          // 深夜は翌日扱い
  const rows = R.route.patterns.map((p, pi) => {
    let best = null;
    for (const e of R.mins){
      const o = e.opts[pi];
      if (o && o.arrive <= target && (!best || e.depart > best.depart)) best = {depart: e.depart, o};
    }
    if (!best) return `<div class="revrow" style="color:${PAT_VAR[pi]}"><span class="d">—</span>` +
      `<span class="l">${esc(p.label)}：この時刻までに着ける便がありません</span></div>`;
    const slack = target - best.o.arrive;
    return `<div class="revrow" style="color:${PAT_VAR[pi]}">` +
      `<span class="d">${fmt(best.depart)}発</span>` +
      `<span class="l num">${esc(p.label)}／${fmt(best.o.arrive)}着・${best.o.total}分・余裕${slack}分</span></div>`;
  }).join("");
  $("rev").innerHTML = rows;
  const overall = [];
  for (const e of R.mins){
    const o = e.opts[e.best];
    if (o.arrive <= target) overall.push(e.depart);
  }
  $("revfoot").textContent = overall.length
    ? `いずれかのパターンで間に合う最終の出発は ${fmt(Math.max(...overall))}。それ以降は間に合いません。`
    : "この時刻に間に合う出発が見つかりません。";
}

/* ---------- いま ---------- */
function nowMinute(){
  const d = new Date();
  let m = d.getHours() * 60 + d.getMinutes();
  if (m < 240) m += 1440;
  return m;
}
function renderNow(){
  const m = nowMinute();
  const el = $("now");
  let e = R.byMin.get(m);
  if (!e){
    const after = R.mins.find(x => x.depart >= m);
    if (!after){
      el.innerHTML = `<p class="chain" style="color:var(--muted)">いま（${fmt(m)}）は運行時間帯の外です。始発は ${fmt(R.mins[0].depart)} ごろ。</p>`;
      return;
    }
    e = after;
  }
  const o = e.opts[e.best];
  const seen = new Set(), list = [];
  for (const x of R.mins){
    if (x.depart < e.depart) continue;
    if (x.depart > e.depart + 150) break;
    const oo = x.opts[x.best];
    if (seen.has(oo.board)) continue;
    seen.add(oo.board);
    list.push({board: oo.board, pat: x.best, o: oo, depart: x.depart});
    if (list.length >= 4) break;
  }
  el.innerHTML =
    `<div class="dhead"><div class="t num">${fmt(m)}</div>` +
    `<div class="sub num">いま出ると ${o.total}分・${fmt(o.arrive)}着` +
    (o.total > R.dayMin ? `／この日の最速より +${o.total - R.dayMin}分` : "") + `</div></div>` +
    `<div class="nowlist">` + list.map(x =>
      `<div class="nowrow"><span class="d">${fmt(x.board)}</span>` +
      `<span style="color:${PAT_VAR[x.pat]}">${esc(firstType(x.o))}</span>` +
      `<span class="num">${esc(R.route.patterns[x.pat].label)}・${x.o.total}分・${fmt(x.o.arrive)}着</span></div>`).join("") +
    `</div>`;
}

/* ---------- events ---------- */
function setHover(m, scrollIntoView){
  if (m == null){ state.hover = null; }
  else {
    const lo = R.mins[0].depart, hi = R.mins[R.mins.length - 1].depart;
    state.hover = Math.max(lo, Math.min(hi, m));
  }
  renderCursor(); renderDetail();
  if (scrollIntoView && state.hover != null){
    const sc = $("scroll"), x = xOf(state.hover);
    if (x < sc.scrollLeft + 40 || x > sc.scrollLeft + sc.clientWidth - 40)
      sc.scrollLeft = x - sc.clientWidth / 2;
  }
}

$("tabs").addEventListener("click", ev => {
  const b = ev.target.closest(".tab"); if (!b) return;
  selectRoute(Number(b.dataset.i));
});
$("zoom").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  state.zoom = Number(b.dataset.z);
  [...$("zoom").children].forEach(c => c.setAttribute("aria-pressed", String(Number(c.dataset.z) === state.zoom)));
  renderChart();
  if (state.hover != null) setHover(state.hover, true);
});
[...$("zoom").children].forEach(c => c.setAttribute("aria-pressed", String(Number(c.dataset.z) === state.zoom)));

const chart = $("chart");
function pointerMinute(ev){
  const r = chart.getBoundingClientRect();
  return minuteAt((ev.clientX - r.left) * (chartW / r.width));
}
chart.addEventListener("pointermove", ev => { if (!state.pinned || ev.pointerType === "mouse") setHover(pointerMinute(ev)); });
chart.addEventListener("pointerdown", ev => { state.pinned = true; setHover(pointerMinute(ev)); chart.focus({preventScroll: true}); });
chart.addEventListener("pointerleave", () => { if (!state.pinned) setHover(null); });
chart.addEventListener("keydown", ev => {
  const step = ev.shiftKey ? 10 : 1;
  if (ev.key === "ArrowRight"){ setHover((state.hover == null ? R.mins[0].depart : state.hover) + step, true); ev.preventDefault(); }
  else if (ev.key === "ArrowLeft"){ setHover((state.hover == null ? R.mins[0].depart : state.hover) - step, true); ev.preventDefault(); }
  else if (ev.key === "Escape"){ state.pinned = false; setHover(null); }
});
$("cliffs").addEventListener("click", ev => {
  const b = ev.target.closest(".cliff"); if (!b) return;
  state.pinned = true;
  setHover(Number(b.dataset.m), true);
  document.getElementById("chart").scrollIntoView({behavior: "smooth", block: "center"});
});
$("arriveBy").addEventListener("input", renderReverse);

let rt = null, lastW = 0;
function refit(){
  clearTimeout(rt);
  rt = setTimeout(() => {
    const w = Math.floor($("scroll").getBoundingClientRect().width);
    if (w !== lastW){ lastW = w; renderChart(); }
  }, 80);
}
window.addEventListener("resize", refit);
if (window.ResizeObserver) new ResizeObserver(refit).observe($("scroll"));
setInterval(() => { renderNow(); renderChart(); }, 30000);

/* ---------- boot ---------- */
$("meta").textContent = `データ: ${D.date || "-"}（${D.source || "-"}）／` +
  `乗換余裕: 守口市${D.config.transfer_moriguchi_min}分・萱島${D.config.transfer_kayashima_min}分・` +
  `枚方市${D.config.transfer_hirakata_min}分・野江の徒歩${D.config.walk_noe_min}分。時刻は当日ダイヤの静的データで、遅延は考慮していません。`;
selectRoute(0);
lastW = Math.floor($("scroll").getBoundingClientRect().width);
requestAnimationFrame(() => { lastW = Math.floor($("scroll").getBoundingClientRect().width); renderChart(); });
</script>
</body>
</html>
