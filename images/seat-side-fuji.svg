<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="seatSideTitle seatSideDesc">
  <title id="seatSideTitle">Which side of the Tokaido Shinkansen Mt. Fuji appears on</title>
  <desc id="seatSideDesc">Two carriage diagrams. Heading west to Kyoto, Mt. Fuji is on the right beside Seat E. Heading east to Tokyo, Mt. Fuji is on the left, still beside Seat E.</desc>
  <rect width="720" height="300" fill="#f6f2e9"/>

  <g font-family="Georgia, 'Yu Mincho', serif" fill="#122334">
    <text x="24" y="34" font-size="17" font-weight="bold">Toward Kyoto / Shin-Osaka</text>
    <text x="392" y="34" font-size="17" font-weight="bold">Toward Tokyo</text>
  </g>

  <!-- westbound -->
  <g transform="translate(24,56)">
    <rect x="0" y="26" width="316" height="92" rx="12" fill="#fffdf8" stroke="#122334" stroke-width="2"/>
    <g font-family="Georgia, serif" font-size="15" fill="#122334" text-anchor="middle">
      <rect x="18" y="46" width="40" height="52" rx="5" fill="#e9e2d4" stroke="#54616c"/><text x="38" y="78">A</text>
      <rect x="62" y="46" width="40" height="52" rx="5" fill="#e9e2d4" stroke="#54616c"/><text x="82" y="78">B</text>
      <rect x="106" y="46" width="40" height="52" rx="5" fill="#e9e2d4" stroke="#54616c"/><text x="126" y="78">C</text>
      <rect x="176" y="46" width="40" height="52" rx="5" fill="#e9e2d4" stroke="#54616c"/><text x="196" y="78">D</text>
      <rect x="220" y="46" width="40" height="52" rx="5" fill="#e8704a" stroke="#bf4d31" stroke-width="2"/><text x="240" y="78" fill="#fffdf8" font-weight="bold">E</text>
    </g>
    <path d="M0 22 L316 22" stroke="#54616c" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="158" y="16" font-family="Georgia, serif" font-size="12" fill="#54616c" text-anchor="middle">direction of travel →</text>
    <g transform="translate(272,126)">
      <path d="M0 34 L20 4 L28 14 L36 4 L56 34 Z" fill="#b9dbe7" stroke="#122334" stroke-width="1.5"/>
    </g>
    <text x="300" y="176" font-family="Georgia, serif" font-size="14" fill="#bf4d31" text-anchor="middle" font-weight="bold">Mt. Fuji — right</text>
  </g>

  <!-- eastbound -->
  <g transform="translate(392,56)">
    <rect x="0" y="26" width="304" height="92" rx="12" fill="#fffdf8" stroke="#122334" stroke-width="2"/>
    <g font-family="Georgia, serif" font-size="15" fill="#122334" text-anchor="middle">
      <rect x="44" y="46" width="40" height="52" rx="5" fill="#e8704a" stroke="#bf4d31" stroke-width="2"/><text x="64" y="78" fill="#fffdf8" font-weight="bold">E</text>
      <rect x="88" y="46" width="40" height="52" rx="5" fill="#e9e2d4" stroke="#54616c"/><text x="108" y="78">D</text>
      <rect x="158" y="46" width="40" height="52" rx="5" fill="#e9e2d4" stroke="#54616c"/><text x="178" y="78">C</text>
      <rect x="202" y="46" width="40" height="52" rx="5" fill="#e9e2d4" stroke="#54616c"/><text x="222" y="78">B</text>
      <rect x="246" y="46" width="40" height="52" rx="5" fill="#e9e2d4" stroke="#54616c"/><text x="266" y="78">A</text>
    </g>
    <path d="M0 22 L304 22" stroke="#54616c" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="152" y="16" font-family="Georgia, serif" font-size="12" fill="#54616c" text-anchor="middle">← direction of travel</text>
    <g transform="translate(36,126)">
      <path d="M0 34 L20 4 L28 14 L36 4 L56 34 Z" fill="#b9dbe7" stroke="#122334" stroke-width="1.5"/>
    </g>
    <text x="64" y="176" font-family="Georgia, serif" font-size="14" fill="#bf4d31" text-anchor="middle" font-weight="bold">Mt. Fuji — left</text>
  </g>

  <text x="360" y="286" font-family="Georgia, serif" font-size="13" fill="#54616c" text-anchor="middle">Seat E faces Mt. Fuji in both directions.</text>
</svg>
