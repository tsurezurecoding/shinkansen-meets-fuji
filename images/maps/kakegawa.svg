<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">掛川城の静的ミニ地図</title>
  <desc id="desc">東海道新幹線の線路上の視点位置と、掛川城の位置関係を示す簡易図です。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17324a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="720" height="360" rx="28" fill="url(#bg)"/>
  <path d="M30 72 C168 24 257 89 388 54 S604 17 690 88" fill="none" stroke="#dce8f2" stroke-width="22" stroke-linecap="round" opacity="0.55"/>
  <path d="M26 286 C145 247 271 330 399 292 S593 242 694 292" fill="none" stroke="#f0dec3" stroke-width="26" stroke-linecap="round" opacity="0.48"/>
  <path d="M585.7 82.9 L557.5 99.2 L471.6 140.4 L397.1 169.1 L328.3 196.6 L276.4 222.5 L202.3 251.5 L145.0 275.2 L134.3 277.1" fill="none" stroke="#17324a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-shadow)"/>
  <path d="M585.7 82.9 L557.5 99.2 L471.6 140.4 L397.1 169.1 L328.3 196.6 L276.4 222.5 L202.3 251.5 L145.0 275.2 L134.3 277.1" fill="none" stroke="#f7fbff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M361.6 183.3 L276.5 214.8" fill="none" stroke="#c76d1d" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 9"/>
  <g transform="translate(361.6 183.3)">
    <circle r="17" fill="#17324a" stroke="#fff" stroke-width="5"/>
    <circle r="5" fill="#fff"/>
  </g>
  <g transform="translate(276.5 214.8)">
    <circle r="18" fill="#ffcf8a" stroke="#a94f12" stroke-width="5"/>
    <circle r="5" fill="#a94f12"/>
  </g>
  <g font-family="Yu Gothic, Meiryo, sans-serif" font-weight="700">
    <text x="28" y="42" font-size="22" fill="#0b1b2b">掛川城</text>
    <text x="28" y="70" font-size="13" fill="#53677a">線路上の視点と対象物の位置関係</text>
    <rect x="28" y="302" width="15" height="15" rx="7.5" fill="#17324a"/>
    <text x="52" y="315" font-size="13" fill="#31465a">線路上の視点</text>
    <rect x="176" y="302" width="15" height="15" rx="7.5" fill="#ffcf8a" stroke="#a94f12" stroke-width="3"/>
    <text x="202" y="315" font-size="13" fill="#31465a">対象物</text>
  </g>
</svg>
