<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="yakeiTitle yakeiDesc">
  <title id="yakeiTitle">夜の車窓から街の明かりを見るイラスト</title>
  <desc id="yakeiDesc">濃紺の夜空の下に灯りのともったビル群が並び、その手前を白い新幹線が走るオリジナルイラストです。</desc>
  <!-- 46x29px のプロモカードでも形が読めるよう要素を絞り、
       線幅・窓の大きさは縮小後2px相当（キャンバス上で約52px）を下限にしている。 -->
  <defs>
    <linearGradient id="ykSky" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#050d1c"/>
      <stop offset="0.55" stop-color="#0f2440"/>
      <stop offset="1" stop-color="#1b3f5e"/>
    </linearGradient>
    <radialGradient id="ykGlow" cx="0.5" cy="1" r="0.75">
      <stop offset="0" stop-color="#ffce8a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffce8a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ykSky)"/>
  <ellipse cx="600" cy="470" rx="620" ry="220" fill="url(#ykGlow)"/>

  <!-- 塔。夜にいちばん目立つ縦の要素 -->
  <g fill="#ffb765">
    <path d="M188 150 L226 150 L268 430 L146 430 Z"/>
    <rect x="178" y="252" width="58" height="26" rx="8" fill="#0f2440" opacity="0.55"/>
    <circle cx="207" cy="120" r="26"/>
  </g>

  <!-- ビル群。窓は大きめの矩形だけにして、縮小時につぶれないようにする -->
  <g fill="#0a1a30">
    <rect x="330" y="250" width="150" height="200"/>
    <rect x="510" y="196" width="128" height="254"/>
    <rect x="668" y="272" width="160" height="178"/>
    <rect x="858" y="222" width="136" height="228"/>
    <rect x="1024" y="300" width="132" height="150"/>
  </g>
  <g fill="#ffd79a">
    <rect x="364" y="290" width="40" height="54"/>
    <rect x="422" y="290" width="40" height="54"/>
    <rect x="364" y="372" width="40" height="54"/>
    <rect x="546" y="240" width="40" height="54"/>
    <rect x="546" y="322" width="40" height="54"/>
    <rect x="704" y="316" width="40" height="54"/>
    <rect x="762" y="316" width="40" height="54"/>
    <rect x="704" y="392" width="40" height="54"/>
    <rect x="892" y="266" width="40" height="54"/>
    <rect x="892" y="348" width="40" height="54"/>
    <rect x="1060" y="344" width="40" height="54"/>
  </g>

  <rect x="0" y="450" width="1200" height="180" fill="#050d1c"/>

  <!-- 新幹線 -->
  <g transform="translate(170 462)">
    <rect x="0" y="0" width="590" height="94" rx="47" fill="#f6f9fc"/>
    <path d="M590 0 h62 c92 0 172 37 210 94 h-272 z" fill="#f6f9fc"/>
    <rect x="0" y="56" width="862" height="20" fill="#7d9bc0"/>
    <g fill="#0f2440" opacity="0.85">
      <rect x="66" y="18" width="56" height="26" rx="8"/>
      <rect x="158" y="18" width="56" height="26" rx="8"/>
      <rect x="250" y="18" width="56" height="26" rx="8"/>
      <rect x="342" y="18" width="56" height="26" rx="8"/>
      <rect x="434" y="18" width="56" height="26" rx="8"/>
      <rect x="526" y="18" width="56" height="26" rx="8"/>
      <rect x="640" y="20" width="46" height="24" rx="8"/>
    </g>
  </g>
</svg>
