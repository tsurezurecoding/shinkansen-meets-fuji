<path d="M52 128 H82 M92 128 H128 M64 138 H136" fill="none" stroke-width="1.8"/>
<text x="100" y="160" text-anchor="middle" font-size="10.5" font-family="'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif" stroke="none">東京から 約27分・E席</text>
</g>
