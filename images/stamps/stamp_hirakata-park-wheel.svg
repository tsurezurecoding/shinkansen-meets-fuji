<circle cx="131.4" cy="111.0" r="3"/><circle cx="113.0" cy="129.4" r="3"/><circle cx="87.0" cy="129.4" r="3"/><circle cx="68.6" cy="111.0" r="3"/><circle cx="68.6" cy="85.0" r="3"/><circle cx="87.0" cy="66.6" r="3"/><circle cx="113.0" cy="66.6" r="3"/><circle cx="131.4" cy="85.0" r="3"/>
